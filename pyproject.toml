[tool.poetry]
name = "halwall"
version = "0.1.0"
description = "HalWall Trusted Package Database and Web Agent"
authors = ["HalWall Team"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.100.0"
uvicorn = {extras = ["standard"], version = "^0.22.0"}
celery = {extras = ["redis"], version = "^5.3.1"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.19"}
alembic = "^1.11.1"
asyncpg = "^0.28.0"
redis = "^4.6.0"
pydantic = "^2.0.2"
pydantic-settings = "^2.0.1"
httpx = "^0.24.1"
python-multipart = "^0.0.6"
yara-python = "^4.3.1"
cryptography = "^41.0.2"
PyNaCl = "^1.5.0"
psycopg2-binary = "^2.9.6"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.7.0"
isort = "^5.12.0"
mypy = "^1.4.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
